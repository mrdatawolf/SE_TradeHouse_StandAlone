<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D System Map - SE TradeHouse</title>
  <link rel="stylesheet" href="../nav.css">
  <link rel="stylesheet" href="../gpsManager.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: white;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 36px;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #aaa;
      font-size: 16px;
    }

    .solary {
      width: 800px;
      height: 800px;
      position: relative;
      margin: 0 auto;
      background-color: #000000;
      padding: 0;
      transform: scale(1);
      border: 2px solid #667eea;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
    }

    /* Central star/planet (Earth equivalent) */
    .earth {
      left: 391px;
      top: 391px;
      height: 18px;
      width: 18px;
      background-color: rgb(115, 114, 174);
      border-radius: 50%;
      position: absolute;
      margin: 0;
      box-shadow: 0 0 10px rgb(115, 114, 174);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .earth:hover {
      transform: scale(1.3);
      box-shadow: 0 0 20px rgb(115, 114, 174);
    }

    /* Inner planet */
    .venus {
      left: 309px;
      top: 389px;
      height: 22px;
      width: 22px;
      background-color: rgb(246, 157, 97);
      border-radius: 50%;
      position: absolute;
      transform-origin: 91px 11px;
      animation: rotate 38.4s infinite linear;
      cursor: pointer;
      box-shadow: 0 0 10px rgb(246, 157, 97);
      transition: transform 0.3s ease;
    }

    .venus:hover {
      transform: scale(1.3);
      box-shadow: 0 0 20px rgb(246, 157, 97);
    }

    .venusOrbit {
      left: 320px;
      top: 320px;
      height: 160px;
      width: 160px;
      background-color: transparent;
      border-radius: 50%;
      border-style: dashed;
      border-color: rgba(246, 157, 97, 0.3);
      position: absolute;
      border-width: 1px;
      margin: 0;
      padding: 0;
    }

    /* Star (Sun) */
    .sun {
      left: 10px;
      top: 380px;
      height: 90px;
      width: 90px;
      background-color: rgb(248, 107, 35);
      border-radius: 50%;
      box-shadow: 0 0 30px rgb(248, 107, 35), 0 0 60px rgb(248, 107, 35);
      position: absolute;
      margin: 0;
      transform-origin: 390px 10px;
      animation: rotate 512s infinite linear;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .sun:hover {
      transform: scale(1.1) rotate(var(--current-rotation, 0deg));
      box-shadow: 0 0 40px rgb(248, 107, 35), 0 0 80px rgb(248, 107, 35);
    }

    .sunOrbit {
      left: 50px;
      bottom: 75px;
      height: 670px;
      width: 700px;
      background-color: transparent;
      border-radius: 50%;
      border-style: dashed;
      border-color: rgba(248, 107, 35, 0.3);
      position: absolute;
      border-width: 1px;
      margin: 0;
      padding: 0;
    }

    /* Outer planet */
    .mars {
      left: 222.5px;
      top: 392.5px;
      height: 15px;
      width: 15px;
      background-color: rgb(140, 119, 63);
      border-radius: 50%;
      position: absolute;
      transform-origin: 177.5px 7.5px;
      animation: rotate 117.5s infinite linear;
      cursor: pointer;
      box-shadow: 0 0 10px rgb(140, 119, 63);
      transition: transform 0.3s ease;
    }

    .mars:hover {
      transform: scale(1.3);
      box-shadow: 0 0 20px rgb(140, 119, 63);
    }

    .marsOrbit {
      left: 230px;
      top: 230px;
      height: 340px;
      width: 340px;
      background-color: transparent;
      border-radius: 50%;
      border-style: dashed;
      border-color: rgba(140, 119, 63, 0.3);
      position: absolute;
      border-width: 1px;
      margin: 0;
      padding: 0;
    }

    @keyframes rotate {
      100% {
        transform: rotate(-360deg);
      }
    }

    /* User location marker */
    .user-location {
      position: absolute;
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 15px #48bb78, 0 0 30px rgba(72, 187, 120, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 100;
      animation: pulse 2s infinite;
    }

    .user-location:hover {
      transform: scale(1.5);
      box-shadow: 0 0 25px #48bb78, 0 0 50px rgba(72, 187, 120, 0.7);
    }

    .user-location::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 15px #48bb78, 0 0 30px rgba(72, 187, 120, 0.5);
      }
      50% {
        box-shadow: 0 0 25px #48bb78, 0 0 50px rgba(72, 187, 120, 0.8);
      }
    }

    .legend {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid #667eea;
    }

    .legend h2 {
      margin-top: 0;
      color: #667eea;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 10px 0;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 5px;
    }

    .legend-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-text {
      flex: 1;
    }

    .legend-name {
      font-weight: bold;
      font-size: 16px;
    }

    .legend-desc {
      font-size: 14px;
      color: #aaa;
      margin-top: 3px;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      border: 1px solid #667eea;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1000;
      font-size: 14px;
    }

    .tooltip.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Nebulon System - 2D Map</h1>
      <p>Interactive 2D representation of the Nebulon planetary system</p>
    </div>

    <div class="solary">
      <!-- Planets will be dynamically loaded from server data -->
    </div>

    <div class="legend">
      <h2>System Bodies</h2>
      <!-- Legend items will be dynamically populated -->
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="../config.js"></script>
  <script src="../planetDataLoader.js"></script>
  <script src="../gpsManager.js"></script>
  <script src="../nav.js"></script>
  <script>
    // Map configuration
    const devisor = 18000;
    const mapCenter = { x: 400, y: 400 }; // Center of the 800x800 map
    const mapScale = 400 / devisor; // Map units per game unit

    // Convert GPS coordinates to 2D map position
    function gpsToMapPosition(gps) {
      // Calculate scaled position relative to center
      const x = mapCenter.x + (gps.x / devisor);
      const z = mapCenter.y + (gps.z / devisor);

      return { x, y: z }; // Using z as y for 2D top-down view
    }

    // Add or update user location marker
    function updateUserMarker() {
      const userGPS = window.gpsManager.getGPS();
      const solary = document.querySelector('.solary');
      let marker = document.getElementById('user-marker');

      // Remove existing marker if no GPS
      if (!userGPS) {
        if (marker) marker.remove();
        return;
      }

      // Calculate position
      const pos = gpsToMapPosition(userGPS);

      // Check if marker is within map bounds
      if (pos.x < 0 || pos.x > 800 || pos.y < 0 || pos.y > 800) {
        if (marker) marker.remove();
        return;
      }

      // Create or update marker
      if (!marker) {
        marker = document.createElement('div');
        marker.id = 'user-marker';
        marker.className = 'user-location';
        marker.setAttribute('data-planet', userGPS.name);
        solary.appendChild(marker);

        // Add tooltip and click functionality
        marker.addEventListener('mouseenter', () => {
          tooltip.textContent = userGPS.name + ' (You)';
          tooltip.classList.add('show');
        });

        marker.addEventListener('mousemove', (e) => {
          tooltip.style.left = e.pageX + 15 + 'px';
          tooltip.style.top = e.pageY + 15 + 'px';
        });

        marker.addEventListener('mouseleave', () => {
          tooltip.classList.remove('show');
        });

        marker.addEventListener('click', () => {
          const coords = `X: ${userGPS.x.toLocaleString()}\nY: ${userGPS.y.toLocaleString()}\nZ: ${userGPS.z.toLocaleString()}`;
          alert(`Your Location: ${userGPS.name}\n\n${coords}`);
        });
      }

      // Update position
      marker.style.left = (pos.x - 8) + 'px'; // -8 to center the 16px marker
      marker.style.top = (pos.y - 8) + 'px';
    }

    // Listen for GPS updates
    window.addEventListener('gpsUpdated', updateUserMarker);
    window.addEventListener('gpsCleared', updateUserMarker);

    // Render planets from server data
    async function renderPlanets() {
      const solary = document.querySelector('.solary');
      const legend = document.querySelector('.legend');

      // Load planet data
      if (window.planetDataLoader) {
        await window.planetDataLoader.loadPlanetData();

        if (window.planetDataLoader.isLoaded()) {
          const planets = window.planetDataLoader.getPlanets();
          const colors = ['#7372ae', '#f69d61', '#e74c3c', '#3498db', '#9b59b6', '#1abc9c', '#f39c12'];

          // Clear legend (keep heading)
          const heading = legend.querySelector('h2');
          legend.innerHTML = '';
          legend.appendChild(heading);

          planets.forEach((planet, index) => {
            const pos = gpsToMapPosition(planet);

            // Skip planets outside map bounds
            if (pos.x < 0 || pos.x > 800 || pos.y < 0 || pos.y > 800) {
              return;
            }

            const color = colors[index % colors.length];

            // Create planet marker
            const planetDiv = document.createElement('div');
            planetDiv.className = 'planet-marker';
            planetDiv.setAttribute('data-planet', planet.name);
            planetDiv.setAttribute('data-gps', JSON.stringify({x: planet.x, y: planet.y, z: planet.z}));
            planetDiv.style.cssText = `
              position: absolute;
              left: ${pos.x - 10}px;
              top: ${pos.y - 10}px;
              width: 20px;
              height: 20px;
              background-color: ${color};
              border-radius: 50%;
              box-shadow: 0 0 10px ${color};
              cursor: pointer;
              transition: transform 0.3s ease;
              z-index: 10;
            `;

            planetDiv.addEventListener('mouseenter', () => {
              planetDiv.style.transform = 'scale(1.3)';
              planetDiv.style.boxShadow = `0 0 20px ${color}`;
            });

            planetDiv.addEventListener('mouseleave', () => {
              planetDiv.style.transform = 'scale(1)';
              planetDiv.style.boxShadow = `0 0 10px ${color}`;
            });

            solary.appendChild(planetDiv);

            // Add to legend
            const legendItem = document.createElement('div');
            legendItem.className = 'legend-item';
            legendItem.innerHTML = `
              <div class="legend-dot" style="background-color: ${color};"></div>
              <div class="legend-text">
                <div class="legend-name">${planet.name}</div>
                <div class="legend-desc">Gravity: ${planet.gravity}g | GPS: ${planet.x.toLocaleString()}, ${planet.y.toLocaleString()}, ${planet.z.toLocaleString()}</div>
              </div>
            `;
            legend.appendChild(legendItem);
          });

          // Re-attach tooltip handlers to all planets (including dynamically created ones)
          attachPlanetTooltips();
        }
      }
    }

    // Attach tooltip handlers to all planet markers
    function attachPlanetTooltips() {
      const tooltip = document.getElementById('tooltip');
      const planets = document.querySelectorAll('[data-planet]');

      planets.forEach(planet => {
        // Remove old listeners by cloning
        const newPlanet = planet.cloneNode(true);
        planet.parentNode.replaceChild(newPlanet, planet);

        newPlanet.addEventListener('mouseenter', () => {
          const name = newPlanet.dataset.planet;
          tooltip.textContent = name;
          tooltip.classList.add('show');
        });

        newPlanet.addEventListener('mousemove', (e) => {
          tooltip.style.left = e.pageX + 15 + 'px';
          tooltip.style.top = e.pageY + 15 + 'px';
        });

        newPlanet.addEventListener('mouseleave', () => {
          tooltip.classList.remove('show');
        });

        newPlanet.addEventListener('click', () => {
          const name = newPlanet.dataset.planet;
          const gpsData = newPlanet.dataset.gps;
          if (gpsData) {
            const coords = JSON.parse(gpsData);
            alert(`${name}\n\nGPS Coordinates:\nX: ${coords.x.toLocaleString()}\nY: ${coords.y.toLocaleString()}\nZ: ${coords.z.toLocaleString()}`);
          } else {
            alert(`You clicked on: ${name}\n\nIn a full implementation, this would show detailed information about the planet/body.`);
          }
        });
      });
    }

    // Initial update
    document.addEventListener('DOMContentLoaded', async () => {
      await renderPlanets();
      setTimeout(updateUserMarker, 100);
    });
  </script>
</body>
</html>
